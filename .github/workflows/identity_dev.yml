name: Build And Push Kwik Nesta Identity Docker Image To Docker Hub

on:
  pull_request:
    branches:
      - develop
    types:
      - closed

jobs:
  if_merged:
    if: github.event.pull_request.merged
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get latest tag from Docker Hub
        id: get_latest_tag
        run: |
          echo "Fetching tags for $REPO..."

          TAGS=$(curl -s "https://hub.docker.com/v2/repositories/${{ secrets.DEV_HUB_USERNAME }}/kwik-nesta-identity/tags?page_size=10000" | jq -r '.results[].name' | grep -E '^v[0-9]+\.[0-9]+$' || echo "")

          MAX_VERSION=$(echo "$TAGS" | sed 's/v//' | sort -V | tail -n 1)

          if [[ -z "$MAX_VERSION" ]]; then
            NEXT_VERSION="1.0"
          else
            MAJOR=$(echo "$MAX_VERSION" | cut -d. -f1)
            MINOR=$(echo "$MAX_VERSION" | cut -d. -f2)

            if [[ "$MINOR" -ge 9 ]]; then
              MAJOR=$((MAJOR + 1))
              MINOR=0
            else
              MINOR=$((MINOR + 1))
            fi

            NEXT_VERSION="$MAJOR.$MINOR"
          fi

          echo "Next version: v$NEXT_VERSION"
          echo "VERSION=v$NEXT_VERSION" >> $GITHUB_OUTPUT

      - name: Build Docker Image with version and live tags
        run: |
          docker build -t ${{ secrets.DEV_HUB_USERNAME }}/kwik-nesta-identity:${{ steps.get_latest_tag.outputs.VERSION }} \
                       -t ${{ secrets.DEV_HUB_USERNAME }}/kwik-nesta-identity:live \
                       -f src/IdentityService/IdentityService.Api/Dockerfile .

      - name: Push Both Docker Image Tags to Docker Hub
        run: |
          docker login -u ${{ secrets.DEV_HUB_USERNAME }} -p ${{ secrets.DEV_HUB_SECRET }}
          docker push ${{ secrets.DEV_HUB_USERNAME }}/kwik-nesta-identity:${{ steps.get_latest_tag.outputs.VERSION }}
          docker push ${{ secrets.DEV_HUB_USERNAME }}/kwik-nesta-identity:live